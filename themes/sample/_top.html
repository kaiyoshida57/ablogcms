	<script>
		$(function() {
			$('.js-slider').slick({
				dots: true,
				arrows: true,
				prevArrow: '<button type="button" class="slick-prev">前へ</button>',
				nextArrow: '<button type="button" class="slick-next">次へ</button>',

				autoplaySpeed: 3000,
			});
		});

	<header class="head-wrapper">
		<div class="acms-container">
			<div class="header header-stack" role="banner">

				<div class="header-logo">
					<div>
						<h1 class="site-name">
              <a href="index.html">
                <!-- BEGIN_IF [{site-icon@path}/nem] -->
                <img src="%{MEDIA_ARCHIVES_DIR}{site-icon@path}" alt="{site-name}" class="site-logo">
                <!-- END_IF -->
                <!-- <img src="%{MEDIA_ARCHIVES_DIR}{site-icon@path}" alt="{site-name}" class="site-logo"> -->

                <!-- BEGIN_IF [{site-name}/nem] -->
                <span class="siteNameText">
                  {site-name}
                <!-- ELSE -->
                  %{BLOG_NAME}
                <!-- END_IF -->
                </span>
              </a>
							<!-- <img src="/images/ablogcms_mark.png" alt="ablogcms" class="site-logo"><span class="siteNameText">sample static site</span></a> -->
						</h1>
					</div>
				</div>
        <!-- END_MODULE Blog_Field -->

							</ul>
						</nav>

					</div>
				</div> -->

			</div>
		</div>
	</header>

	<div class="acms-container">

    <!-- BEGIN_MODULE Media_Banner id="top_image" -->
    <div class="module-section">
      <div class="js-slider">
        <!-- <div>
          <a href="list.html" target="_self" class="slider-item"><img src="/images/slider_zoo1.jpg" width="1150" height="400" alt="" class="acms-img-responsive slider-image" /></a>
        </div> -->
        <!-- BEGIN banner:loop -->
        <!-- BEGIN banner#img -->
        <div>
          <a href="{url}" target="_self" class="slider-item">
            <img src="%{MEDIA_ARCHIVES_DIR}{img}" width="{x}" height="{y}" alt="{alt}" class="acms-img-responsive slider-image" />
          </a>
        </div>
        <!-- END banner#img -->
        <!-- END banner:loop -->
      </div>
    </div>
    <!-- END_MODULE Media_Banner -->

			<div class="js-slider">

				<div>
					<a href="list.html" target="_self" class="slider-item"><img src="/images/slider_zoo1.jpg" width="1150" height="400" alt="" class="acms-img-responsive slider-image" /></a>
				</div>

			</div>
		</div> -->

		<div class="acms-grid">
			<main class="acms-col-lg-9 main">
        <!-- BEGIN_MODULE Entry_Headline id="top_headline" -->
				<section class="module-section">
					<div class="module-header clearfix">
						<h2 class="module-heading">お知らせの一覧</h2>
						<a href="/news/" class="module-index-link"><span class="acms-icon acms-icon-arrow-right"></span>一覧</a>
					</div>

					<ul class="headline acms-list-group clearfix">

            <!-- BEGIN entry:loop -->
            <li class="acms-list-group-item headline-item  js-biggerlink">
              <time class="headline-dat" datetime="{date#Y}-{date#m}-{date#d}">{date#Y}年{date#m}月{date#d}日( {date#l}[weekEN2JP] )</time>
              <!-- BEGIN category:veil --> <span class="acms-label acms-label-default">{categoryName}</span><!-- END category:veil -->
              <a href="{url}" class="acms-list-group-title-link headline-title">{title}</a>
              <!-- BEGIN new --><span class="acms-label acms-label-warning">New!</span><!-- END new -->
            </li>
            <!-- END entry:loop -->

					</ul>
				</section>
        <!-- END_MODULE Entry_Headline -->

			</main>

			<div class="acms-col-lg-3 sub">

        <div class="module-section">
          <section class="search">
            <div class="module-header clearfix">
              <h2 class="module-heading">検索</h2>
            </div>
            <form action="" method="post" name="searchForm" class="acms-form search-form" role="search">
              <div class="acms-form-action">
                <input type="search" id="searchForm" name="keyword" value="%{KEYWORD}" size="15" class="search-form-input">
                <input type="hidden" name="query" value="keyword">
                <span class="acms-form-side-btn"><button type="submit" name="ACMS_POST_2GET" class="acms-btn btn-search"><span class="acms-icon-search"></span><span class="acms-hide-visually">検索</span></button></span>
                <input type="hidden" name="tpl" value="/entry.html">
                <input type="hidden" name="bid" value="1">
              </div>
            </form>
          </section>
        </div>

				<section class="module-section">
					<div class="module-header clearfix">
						<h2 class="module-heading">バナー</h2>
					</div>
					<ul class="banner">
						<li class="banner-list-item ">
							<a href="https://www.a-blogcms.jp/"><img src="/images/ablogcms_logo.png" width="300" height="135" alt="a-blog cms" class="acms-img-responsive" /></a>
						</li>
					</ul>
				</section>

			</div>
		</div>

	<footer class="foot-wrapper">
		<div class="footer acms-container sp-container">
			<div class="acms-grid">
        <!-- BEGIN_MODULE Blog_Field -->
				<address class="acms-col-md-4">
          <!-- BEGIN company:veil -->
					<dl class="company-about">
            <!-- BEGIN company-name:veil --><dt class="company-name">{company-name}</dt><!-- END company-name:veil -->
            <!-- BEGIN zip:veil --><dd class="company-detail">〒{zip}</dd><!-- END zip:veil -->
            <!-- BEGIN address:veil --><dd class="company-detail">{address}</dd><!-- END address:veil -->
            <!-- BEGIN tel:veil --><dd class="company-detail">TEL : <a href="tel:{tel}">{tel}</a></dd><!-- END tel:veil -->
					</dl>
          <!-- END company:veil -->
				</address>
        <!-- END_MODULE Blog_Field -->
				<div class="acms-col-md-8">
          <!-- BEGIN sns:veil -->
					<div class="acms-hide acms-block-lg acms-block-xl">
						<ul class="sns-list">
							<!-- BEGIN facebook:veil --><li class="sns-list-item"><a href="{facebook}" class="sns-list-facebook"><span class="acms-icon-facebook"></span></a></li><!-- END facebook:veil -->
							<!-- BEGIN twitter:veil --><li class="sns-list-item"><a href="{twitter}" class="sns-list-twitter"><span class="acms-icon-twitter"></span></a></li><!-- END twitter:veil -->
							<!-- BEGIN youtube:veil --><li class="sns-list-item"><a href="{youtube}" class="sns-list-youtube"><span class="acms-icon-youtube"></span></a></li><!-- END youtube:veil -->
						</ul>
					</div>
          <!-- END sns:veil -->
					<p class="page-top"><a class="scrollTo" href="#"><span class="page-top-btn">ページの先頭へ</span></a></p>
				</div>
        <!-- END_MODULE Blog_Field -->
			</div>
		</div>
		<div class="copyright">
			<p class="copyright-text acms-container acms-text-center">powered by <a href="http://www.a-blogcms.jp/"><img src="/images/acms.svg" width="96" alt="a-blog cms" class="copryright-logo" /></a></p>
		</div>
