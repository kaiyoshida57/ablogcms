<table class="acms-admin-table-admin-edit">
  <tbody>
    <tr>
      <th>アイコン</th>
      <td class="js-media-field">
        <div class="js-droparea" data-thumbnail="{site-icon@thumbnail}" data-type="image" data-thumbnail-type="{site-icon@type}" data-width="200px" data-height="200px"></div>
        <p class="js-text acms-admin-text-danger" style="display:none">許可されていないファイルのため挿入できません。</p>
        <div class="acms-admin-margin-top-mini">
          <button type="button" class="js-insert acms-admin-btn" data-type="image">メディアを選択</button>
        </div>
        <input type="hidden" name="site-icon" class="js-value" value="{site-icon}" />
        <input type="hidden" name="field[]" value="site-icon" />
        <input type="hidden" name="site-icon:extension" value="media" />
      </td>
    </tr>
    <tr>
      <th>サイト名</th>
      <td>
        <input type="text" name="site-name" class="acms-admin-form-width-full" value="{site-name}" />
        <input type="hidden" name="field[]" value="site-name" />
      </td>
    </tr>
  </tbody>
</table>

<table class="acms-admin-table-admin-edit">
  <tbody>
    <tr>
      <th>会社名</th>
      <td>
        <input type="text" name="company-name" class="acms-admin-form-width-full" value="{company-name}" />
        <input type="hidden" name="field[]" value="company-name" />
      </td>
    </tr>
    <tr>
      <th>郵便番号</th>
      <td>
        <input type="text" name="zip" class="acms-admin-form-width-full" value="{zip}" />
        <input type="hidden" name="field[]" value="zip" />
      </td>
    </tr>
    <tr>
      <th>住所</th>
      <td>
        <input type="text" name="address" class="acms-admin-form-width-full" value="{address}" />
        <input type="hidden" name="field[]" value="address" />
      </td>
    </tr>
    <tr>
      <th>電話番号</th>
      <td>
        <input type="text" name="tel" class="acms-admin-form-width-full" value="{tel}" />
        <input type="hidden" name="field[]" value="tel" />
      </td>
    </tr>
  </tbody>
</table>

<table class="acms-admin-table-admin-edit">
  <tbody>
    <tr>
      <th>Facebook</th>
      <td>
        <input type="text" name="facebook" class="acms-admin-form-width-full" value="{facebook}" />
        <input type="hidden" name="field[]" value="facebook" />
      </td>
    </tr>
    <tr>
      <th>Twitter</th>
      <td>
        <input type="text" name="twitter" class="acms-admin-form-width-full" value="{twitter}" />
        <input type="hidden" name="field[]" value="twitter" />
      </td>
    </tr>
    <tr>
      <th>YouTube</th>
      <td>
        <input type="text" name="youtube" class="acms-admin-form-width-full" value="{youtube}" />
        <input type="hidden" name="field[]" value="youtube" />
      </td>
    </tr>
  </tbody>
</table>
